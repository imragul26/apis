name: OpenAPI Spectral Check

on:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  spectral-lint:
    name: Run Spectral Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Spectral
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: "apis.yaml"
          spectral_ruleset: ".spectral.yaml"
